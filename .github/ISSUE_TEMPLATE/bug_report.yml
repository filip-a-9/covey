name: Bug report
description: Something in Covey crashed or behaved wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `covey doctor --json`
      render: json
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Ubuntu 24.04, macOS 15.1, WSL2
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
    validations:
      required: true
  - type: input
    id: covey
    attributes:
      label: Covey version
