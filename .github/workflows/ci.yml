name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs CI on the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No desktop notification attempts on runners. tests/conftest.py sets this too, but
  # `covey up` subprocesses and the CLI steps should agree.
  COVEY_NOTIFY: log
  # uv's standalone Python on every OS. The macOS runner's python.org framework build re-launches
  # itself as Python.app, which replaces argv[0], so a test's `claude` symlink to Python never
  # looks like `claude` to ps.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  check:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11"]
        include:
          # requires-python is >=3.11: also run the newest on Linux.
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both the action and uv are pinned so a new uv release cannot change lint or test
      # results under us: ruff and the lockfile are pinned for the same reason. Bump
      # them together, on purpose. The action is pinned by commit SHA (tag in the comment).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true

      # uv downloads the matrix interpreter itself (UV_PYTHON overrides .python-version).
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # tests/conftest.py points COVEY_CLAUDE at a nonexistent binary and COVEY_NOTIFY at
      # `log` for every test, so no real `claude` is reached and no env is needed here.
      # The gate is the measured coverage (98.8%) of router, grants and registry, rounded down.
      - run: >-
          uv run pytest -q --cov=covey.daemon.router --cov=covey.daemon.grants
          --cov=covey.daemon.registry --cov-fail-under=98

      # Smoke: the daemon starts and doctor answers as JSON. doctor exits 1 on a runner
      # without `claude`, so its status is not checked; `up` failing fails the step.
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        env:
          COVEY_HOME: ${{ runner.temp }}/covey-smoke
        run: |
          uv run covey up
          uv run covey doctor --json || true
          uv run covey down
