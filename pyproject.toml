[project]
name = "covey-mesh"
version = "0.1.2"
description = "A local agent mesh: discovery, delegation and permissions for the agents on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EDantes" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "typer==0.28.0",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/filip-a-9/covey"
Issues = "https://github.com/filip-a-9/covey/issues"

[project.scripts]
covey = "covey.cli:app"
coveyd = "covey.daemon.app:main"

[project.optional-dependencies]
tui = [
    "textual==8.2.8",
]
notify = [
    "plyer==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "openapi-spec-validator==0.9.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]
